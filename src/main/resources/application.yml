# ShopVault - production-safe defaults. Secrets and connection details come from the
# environment (see .env.example); the app refuses to start without them.
spring:
  application:
    name: shopvault
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  # 'native' trusts X-Forwarded-For only from private-network proxies. Set to 'none' if the app is
  # exposed directly to the internet without a reverse proxy.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    issuer: ${JWT_ISSUER:shopvault}
    audience: ${JWT_AUDIENCE:shopvault-api}
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  security:
    max-failed-logins: 5
    lock-duration: 15m
    max-request-bytes: 1048576
    rate-limit:
      enabled: true
      auth-per-minute: 10
      api-per-minute: 300
  shop:
    currency: ${SHOP_CURRENCY:MYR}
    shipping-flat-cents: 1000
    free-shipping-threshold-cents: 15000
    payment-timeout: 30m
    max-cart-lines: 50
    max-quantity-per-line: 99
  payments:
    provider: ${PAYMENT_PROVIDER:simulated}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    webhook-tolerance: 5m
    checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:https://pay.example.com/checkout}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
